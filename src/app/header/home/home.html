<app-header></app-header>
<div id="header-carousel" class="carousel slide hero" data-bs-ride="carousel">

  <div class="carousel-inner">

    <div class="carousel-item active">
      
      <img [src]="imageBaseUrl + 'images/1.jpg'" class="w-100 hero-img" alt="">

    </div>

  </div>

</div>

<!-- NEW STATS BAR -->
<section class="stats-bar">
  <div class="stat">
    <i class="bi bi-people-fill"></i>
    <h2>500+</h2>
    <p>Students Trained</p>
  </div>

  <div class="stat">
    <i class="bi bi-check-lg"></i>
    <h2>120+</h2>
    <p>Projects Completed</p>
  </div>

  <div class="stat">
    <i class="bi bi-award-fill"></i>
    <h2>15+</h2>
    <p>Programs Offered</p>
  </div>

  <div class="stat">
    <i class="bi bi-briefcase-fill"></i>
    <h2>80%</h2>
    <p>Placement Rate</p>
  </div>
</section>

<app-section2></app-section2>
<app-section1></app-section1>

<app-section4></app-section4>
<app-projects></app-projects>
<app-footer></app-footer>
<div class="wa-container">

  <!-- Chat Box -->
  <div class="wa-box" *ngIf="isOpen">
    <div class="wa-header">
      <div>
        <strong>S2S Web Solutions</strong>
        <p>Typically replies within a minute</p>
      </div>
      <span (click)="toggle()">✕</span>
    </div>

    <div class="wa-body">
      <p>Hi there! 👋<br>How can I help you?</p>
    </div>

    <a 
      [href]="'https://wa.me/919703180922?text=' + message" 
      target="_blank"
      class="wa-start"
    >
      Start Chat
    </a>
  </div>

  <!-- Floating Button -->
  <div class="wa-button" (click)="toggle()">
    <i class="bi bi-whatsapp"></i>
  </div>

</div>
<button *ngIf="showScroll" class="scroll-top" (click)="scrollToTop()">
  <i class="bi bi-arrow-up"></i>
</button>
