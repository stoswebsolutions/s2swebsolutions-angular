<section class="services-section">
  <div class="container">

    <div class="service-card" *ngFor="let item of services; let i = index" [class.active]="activeIndex === i">

      <!-- TOP -->
      <div class="card-header" (click)="toggleAccordion(i)">

        <div class="left">
          <div class="icon-box">
            <img [src]="item.image || imageBaseUrl + 'assets/default-icon.png'" alt="{{ item.title }}" />
          </div>

          <div>
            <span class="badge">Plan</span>
            <h3>{{ item.title }}</h3>
            <p class="subtitle">{{ item.description }}</p>
          </div>
        </div>

        <div class="arrow">
          →
        </div>

      </div>

      <!-- CONTENT -->
      <div class="card-content">

        <div class="features">

          <div class="feature" *ngFor="let point of item.points">
            <span class="check">✔</span>
            <span>{{ point }}</span>
          </div>

        </div>

        <button class="btn">Contact Us</button>

      </div>

    </div>

  </div>
</section>
