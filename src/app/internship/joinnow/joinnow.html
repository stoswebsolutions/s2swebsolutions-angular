<app-head></app-head>

<section class="reg-section">

  <div class="container">

    <!-- LEFT FORM -->
    <div class="form-box">
      <h2>Apply for Internship</h2>
      <p class="subtitle">Start your career journey with us</p>

      <form action="internaction" method="post" novalidate>

        <div class="input-group">
          <label>Full Name</label>
          <input type="text" name="name" required>
        </div>

        <div class="row">
          <div class="input-group">
            <label>Email</label>
            <input type="email" name="email" required>
          </div>
          <div class="input-group">
            <label>Phone</label>
            <input type="tel" name="phone" required>
          </div>
        </div>

        <div class="input-group">
          <label>Qualification</label>
          <select name="qualification" required>
            <option value="">Select</option>
            <option>B.Tech</option>
            <option>M.Tech</option>
            <option>MCA</option>
            <option>Degree</option>
            <option>Diploma</option>
          </select>
        </div>

        <div class="row">
          <div class="input-group">
            <label>College</label>
            <input type="text" name="college" required>
          </div>
          <div class="input-group">
            <label>Passout Year</label>
            <input type="number" name="passout" required>
          </div>
        </div>

        <div class="input-group">
          <label>Internship Program</label>
          <select name="interest" required>
            <option value="">Choose</option>
            <option>MEAN Stack</option>
            <option>MERN Stack</option>
            <option>Python Full Stack</option>
            <option>Java Full Stack</option>
            <option>Flutter</option>
          </select>
        </div>

        <div class="input-group">
          <label>Preferred Location</label>
          <input type="text" name="joblocation" required>
        </div>

        <button type="submit" class="submit-btn">Submit Application</button>

      </form>
    </div>

    <!-- RIGHT INFO PANEL -->
    <div class="info-box">
      <h3>Why Join Us?</h3>

      <ul>
        <li>✔ Real-time Projects</li>
        <li>✔ Industry Mentors</li>
        <li>✔ Certificate</li>
        <li>✔ Placement Support</li>
      </ul>

      <div class="highlight">
        <h4>Limited Seats Available</h4>
        <p>Apply now and secure your internship slot.</p>
      </div>
    </div>

  </div>

</section>

<app-foot></app-foot>
